spring:
  datasource:
    url: >-
      jdbc:mysql://localhost:3306/foodie_db
      ?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      &serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
      &cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250
      &prepStmtCacheSqlLimit=2048
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: FoodieHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 3000

logging:
  level:
    com.foodie: DEBUG
    # 打开可以看到缓存是否命中、SQL 是否被 N+1 拖累
    org.springframework.cache: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: INFO
