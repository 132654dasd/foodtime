# ============================================================================
spring:
  datasource:
    url: >-
      jdbc:mysql://localhost:3306/foodie_db
      ?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      &serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
      &cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250
      &prepStmtCacheSqlLimit=2048
    # 凭据不写进仓库：优先读环境变量，其次由 backend/application-local.yml 提供
    # （dev 通过 spring.profiles.group 自动叠加 local，见 application.yml）
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: FoodieHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 3000

logging:
  level:
    com.foodie: DEBUG
    # 打开可以看到缓存是否命中、SQL 是否被 N+1 拖累
    org.springframework.cache: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: INFO
