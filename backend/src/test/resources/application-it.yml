# ============================================================================
#  it —— 集成测试专用（打真实 MySQL 的独立库 foodie_db_test）
#
#  为什么必须打真实数据库：
#  V1 里的中文全文索引用了 MySQL 专有的 ngram 解析器，
#  `MATCH ... AGAINST` 在 H2 上根本不存在。用 H2 假装测过，
#  等于把最需要验证的 SQL 排除在测试之外。
#
#  运行：mvnw verify   （failsafe 插件只跑 *IT）
#  前置：本机 MySQL 在 3306，且已创建 foodie_db_test
# ============================================================================
spring:
  datasource:
    url: >-
      jdbc:mysql://localhost:3306/foodie_db_test
      ?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      &serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    # 同 dev：凭据来自环境变量或 backend/application-local.yml，仓库里不留明文
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: FoodieItPool
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 每次集成测试前重建，保证断言不受上一次运行的残留数据影响
    clean-disabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  jwt:
    issuer: foodie-it
    secret: aW50ZWdyYXRpb24tdGVzdC1vbmx5LXNlY3JldC1mb3ItZm9vZGllLTAwMDAwMDA=
    access-token-ttl: 10m
    remember-me-ttl: 1h
  upload:
    dir: ./target/it-uploads
